<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZT Software Timer</title>
<style>
  :root{
    --bg:#0a0e17; --surface:#0d1220; --surface2:#111a2e; --border:#1a2744;
    --text:#e8f0fe; --dim:#8fa4bf; --accent:#00ff88; --cyan:#00ccff; --purple:#8844ff;
    --mono:'JetBrains Mono','Consolas','Courier New',monospace; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:var(--sans); display:flex; align-items:flex-start; justify-content:center; padding:32px 16px;
  }
  .card{
    width:100%; max-width:600px;
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    border:1px solid var(--border); border-radius:16px; padding:32px;
    box-shadow:0 8px 32px rgba(0,0,0,.5), 0 0 100px rgba(0,255,136,.04);
  }
  .accent-bar{height:3px; margin:-32px -32px 24px; background:linear-gradient(90deg,var(--accent),var(--cyan),var(--purple));}
  h1{font-family:var(--mono); font-size:18px; letter-spacing:1px; margin:0 0 6px;}
  p.sub{color:var(--dim); font-size:13px; margin:0 0 24px; font-family:var(--mono);}

  .field{display:flex; flex-direction:column; gap:6px;}
  label{font-size:12px; font-family:var(--mono); color:var(--dim); letter-spacing:.5px;}
  input[type=number]{
    font:inherit; font-size:max(1.15rem,1em); font-family:var(--mono);
    background:var(--surface2); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:.7rem .8rem; min-height:50px; width:100%;
  }
  input:focus-visible, .tbl-wrap:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .hide{margin-top:16px; background:rgba(136,68,255,.06); border:1px solid rgba(136,68,255,.25);
    border-radius:10px; padding:12px 16px; font-family:var(--mono); font-size:12px; color:var(--dim);}
  .hide b{color:var(--purple); font-weight:600;}

  /* ---- ladder ---- */
  h2{font-family:var(--mono); font-size:13px; letter-spacing:1px; margin:26px 0 4px; color:var(--cyan);}
  .tbl-wrap{overflow:auto; max-block-size:min(520px,62vh); margin-top:12px;
    border:1px solid var(--border); border-radius:10px; container-type:inline-size;}
  table{border-collapse:separate; border-spacing:0; width:100%; font-family:var(--mono); font-size:13px;}
  thead{position:sticky; inset-block-start:0; z-index:2;}
  thead th{background:var(--surface2); color:var(--cyan); text-align:right; font-weight:600;
    padding:10px 14px; border-bottom:1px solid var(--border); font-size:11px; letter-spacing:.5px; white-space:nowrap;}
  thead th:first-child{text-align:left;}
  tbody th{position:sticky; inset-inline-start:0; z-index:1; background:var(--surface);
    text-align:left; font-weight:600; padding:7px 14px; color:var(--dim); white-space:nowrap;}
  tbody td{padding:7px 14px; text-align:right; white-space:nowrap; color:var(--text);}
  tbody td.ssd{color:var(--dim);}
  tbody tr:nth-child(even) th{background:#0f1526;}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.015);}
  tbody tr.mark th{color:var(--accent);}
  tbody tr.mark td{background:rgba(0,255,136,.06);}

  @container (width < 420px){
    thead th:nth-child(3), tbody td.ssd{display:none;}
  }

  p.note{color:var(--dim); font-size:11px; margin:18px 0 0; font-family:var(--mono); line-height:1.6;}
  a{color:var(--accent);}
</style>
</head>
<body>
  <div class="card">
    <div class="accent-bar"></div>
    <h1>&gt;_ Software Timer</h1>
    <p class="sub">// install &amp; delete time on your own servers</p>

    <form id="f">
      <div class="field">
        <label for="mhz">Your total MHz</label>
        <input type="number" id="mhz" min="1" max="999999" step="1" value="18080"
               inputmode="numeric" autocomplete="off">
      </div>
    </form>

    <div class="hide" aria-live="polite">
      Hide v10: <b id="h1">&mdash;</b> cracker &nbsp;·&nbsp; <b id="h2">&mdash;</b> hasher/firewall
    </div>

    <h2>Version ladder</h2>
    <div class="tbl-wrap" tabindex="0" role="region" aria-labelledby="lad-h">
      <table>
        <thead><tr>
          <th scope="col" id="lad-h">Version</th>
          <th scope="col">Install / Delete</th>
          <th scope="col">With SSD</th>
        </tr></thead>
        <tbody id="lad"></tbody>
      </table>
    </div>

    <p class="note"><a href="./index.html">&larr; back</a></p>
  </div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const mhzEl = $('mhz'), STORE = 'zt-software-timer';

  const clamp = (raw, lo, hi, dflt) => {
    const n = Math.round(Number(raw));
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt;
  };
  const sec = (v, mhz, ssd) =>
    Math.max(4, 7.3 * Math.pow(v - 1, 1.5) * (500 / mhz) * (ssd ? 0.7 : 1));

  function fmt(s) {
    if (s < 59.5) return Math.round(s) + ' s';
    const m = Math.round(s / 60);
    if (m < 60) return m + ' min';
    const h = Math.floor(m / 60), rm = m % 60;
    return rm ? h + 'h ' + rm + 'm' : h + ' h';
  }

  function go() {
    const mhz = clamp(mhzEl.value, 1, 999999, 500);

    const slope = 3 / 3500;
    $('h1').textContent = fmt(Math.max(60, (25 + slope * 500 - slope * mhz) * 60));
    $('h2').textContent = fmt(Math.max(60, (23 + slope * 500 - slope * mhz) * 60));

    const tb = document.createElement('tbody');
    tb.id = 'lad';
    for (let v = 1; v <= 100; v++) {
      const tr = document.createElement('tr');
      if (v % 10 === 0) tr.className = 'mark';

      const th = document.createElement('th');
      th.scope = 'row';
      th.textContent = 'v' + v;

      const a = document.createElement('td');
      a.textContent = fmt(sec(v, mhz, false));

      const b = document.createElement('td');
      b.className = 'ssd';
      b.textContent = fmt(sec(v, mhz, true));

      tr.append(th, a, b);
      tb.append(tr);
    }
    $('lad').replaceWith(tb);

    try { localStorage.setItem(STORE, JSON.stringify({ mhz })); } catch (e) {}
  }

  mhzEl.addEventListener('input', go);
  $('f').addEventListener('submit', e => e.preventDefault());

  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (s && s.mhz) mhzEl.value = String(clamp(s.mhz, 1, 999999, 18080));
  } catch (e) {}

  go();
})();
</script>
</body>
</html>
